name: Claude CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'claude/**'
      - '.github/workflows/claude-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'claude/**'
      - '.github/workflows/claude-ci.yml'

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: ddms_test
          POSTGRES_USER: ddms
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          cd claude/backend
          uv pip install --system -e ".[dev]"

      - name: Run linting
        run: |
          cd claude/backend
          ruff check .
          mypy ddms

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://ddms:password@localhost:5432/ddms_test
        run: |
          cd claude/backend
          pytest --cov=ddms --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./claude/backend/coverage.xml

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: claude/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd claude/frontend
          npm ci

      - name: Run linting
        run: |
          cd claude/frontend
          npm run lint

      - name: Run type check
        run: |
          cd claude/frontend
          npm run build

      - name: Run tests
        run: |
          cd claude/frontend
          npm test

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          cd claude
          docker compose build
