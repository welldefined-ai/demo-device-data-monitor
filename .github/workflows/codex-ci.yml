name: Codex CI

on:
  push:
    paths:
      - 'codex/**'
      - '.github/workflows/codex-ci.yml'
  pull_request:
    paths:
      - 'codex/**'
      - '.github/workflows/codex-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system '.[dev]'
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy .
      - name: Tests (smoke)
        run: PYTHONPATH=. uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci || true
      - name: Lint
        run: npx eslint "src/**/*.{ts,tsx}" || true
      - name: Unit tests
        run: npx vitest run || true
