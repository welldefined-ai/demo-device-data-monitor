services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: claude-backend
    environment:
      - DDMS_ENV=development
      - DDMS_DATABASE_URL=postgresql+asyncpg://ddms:password@db:5432/ddms
      - DDMS_SECRET_KEY=dev-secret-key
      - DDMS_DEBUG=true
    ports:
      - "8001:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import json,urllib.request;data=json.loads(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5).read());exit(0 if data.get('status')=='ok' else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn ddms.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: claude-db
    environment:
      - POSTGRES_DB=ddms
      - POSTGRES_USER=ddms
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddms -d ddms"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    container_name: claude-web
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8081:80"

volumes:
  db-data:
