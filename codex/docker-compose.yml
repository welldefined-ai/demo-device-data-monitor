services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: ddms-backend
    environment:
      - DDMS_ENV=production
      # - DDMS_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/ddms
    ports:
      - "8800:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/docker/nginx/Dockerfile
    container_name: ddms-web
    depends_on:
      - backend
    ports:
      - "8080:80"

  # db:
