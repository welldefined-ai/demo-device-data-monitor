name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest fastapi uvicorn sqlalchemy pydantic pydantic-settings
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy .
      - name: Tests (smoke)
        run: pytest -q || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci || true
      - name: Lint
        run: npx eslint "src/**/*.{ts,tsx}" || true
      - name: Unit tests
        run: npx vitest run || true

